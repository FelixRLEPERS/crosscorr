      <stop offset="0%"   stop-color="#fff5cc" stop-opacity="1"/>
      <stop offset="25%"  stop-color="#ffcc00" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cc-w1-ru" x1="0%" y1="0%" x2="100%" y2="100%">
