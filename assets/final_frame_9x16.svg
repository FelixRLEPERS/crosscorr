<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="КРОССКОР — вертикальный кадр">
  <defs>
    <radialGradient id="star-glow-v" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff8d8" stop-opacity="1"/>
      <stop offset="20%"  stop-color="#ffcc00" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#ffcc00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ghost-glow-v" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#fff5cc" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#ffcc00" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave-cyan-v" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7ee0ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#7ee0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7ee0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave-gold-v" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffcc00" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffcc00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0b1220" stop-opacity="0.9"/>
      <stop offset="35%"  stop-color="#0b1220" stop-opacity="0"/>
      <stop offset="65%"  stop-color="#0b1220" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft-glow-v" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="big-glow-v" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="text-glow-v" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="#0b1220"/>

  <g fill="#7ee0ff">
    <circle cx="120"  cy="180"  r="1.6" opacity="0.55"/>
    <circle cx="320"  cy="90"   r="1.1" opacity="0.40"/>
    <circle cx="840"  cy="140"  r="1.4" opacity="0.50"/>
    <circle cx="960"  cy="260"  r="0.9" opacity="0.35"/>
    <circle cx="70"   cy="420"  r="1.2" opacity="0.45"/>
    <circle cx="1000" cy="480"  r="1.5" opacity="0.55"/>
    <circle cx="180"  cy="620"  r="1.0" opacity="0.35"/>
    <circle cx="920"  cy="700"  r="1.3" opacity="0.45"/>
    <circle cx="60"   cy="1180" r="1.1" opacity="0.40"/>
    <circle cx="1020" cy="1240" r="1.4" opacity="0.50"/>
    <circle cx="200"  cy="1560" r="1.0" opacity="0.35"/>
    <circle cx="880"  cy="1620" r="1.3" opacity="0.45"/>
    <circle cx="400"  cy="1780" r="1.5" opacity="0.55"/>
    <circle cx="680"  cy="1860" r="1.0" opacity="0.35"/>
    <circle cx="540"  cy="180"  r="0.8" opacity="0.30"/>
    <circle cx="240"  cy="1400" r="0.9" opacity="0.35"/>
    <circle cx="820"  cy="1440" r="1.2" opacity="0.40"/>
  </g>
  <g fill="#ffcc00">
    <circle cx="460"  cy="120"  r="0.9" opacity="0.45"/>
    <circle cx="660"  cy="220"  r="1.2" opacity="0.50"/>
    <circle cx="160"  cy="880"  r="0.8" opacity="0.35"/>
    <circle cx="920"  cy="900"  r="1.0" opacity="0.40"/>
    <circle cx="300"  cy="1700" r="1.1" opacity="0.45"/>
    <circle cx="780"  cy="1760" r="0.9" opacity="0.40"/>
  </g>

  <g filter="url(#soft-glow-v)" fill="none" stroke-linecap="round">
    <path d="M 60,960 C 260,760 340,1160 540,960 C 740,760 820,1160 1020,960"
          stroke="url(#wave-cyan-v)" stroke-width="4" opacity="0.9"/>
    <path d="M 60,960 C 260,760 340,1160 540,960 C 740,760 820,1160 1020,960"
          stroke="url(#wave-cyan-v)" stroke-width="12" opacity="0.15"/>
    <path d="M 60,960 C 260,1160 340,760 540,960 C 740,1160 820,760 1020,960"
          stroke="url(#wave-gold-v)" stroke-width="4" opacity="0.9"/>
    <path d="M 60,960 C 260,1160 340,760 540,960 C 740,1160 820,760 1020,960"
          stroke="url(#wave-gold-v)" stroke-width="12" opacity="0.15"/>
  </g>

  <circle cx="540" cy="960" r="280" fill="url(#star-glow-v)" opacity="0.35"/>
  <circle cx="540" cy="960" r="140" fill="url(#star-glow-v)"/>
  <circle cx="540" cy="960" r="22"  fill="#fff8d8"/>
  <circle cx="540" cy="960" r="38"  fill="none" stroke="#ffcc00" stroke-width="1.6" stroke-opacity="0.75"/>
  <circle cx="540" cy="960" r="56"  fill="none" stroke="#ffcc00" stroke-width="0.9" stroke-opacity="0.35"/>

  <text x="540" y="810" text-anchor="middle"
        font-family="'Golos Text','PT Sans','Inter',system-ui,sans-serif"
        font-size="128" font-weight="800" fill="#e6edf3" letter-spacing="-2"
        filter="url(#text-glow-v)">
    КРОССКОР
  </text>
  <text x="540" y="880" text-anchor="middle"
        font-family="'Inter','Space Grotesk',system-ui,sans-serif"
        font-size="34" font-weight="500" fill="#7ee0ff" letter-spacing="10">
    CROSSCORR
  </text>

  <line x1="380" y1="930" x2="700" y2="930"
        stroke="#7ee0ff" stroke-width="1" stroke-opacity="0.5"/>

  <text x="540" y="1130" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code','Courier New',monospace"
        font-size="30" font-weight="500" fill="#e6edf3" letter-spacing="0.5">
    github.com/FelixRLEPERS/crosscorr
  </text>

  <text x="540" y="1300" text-anchor="middle"
        font-family="'Golos Text','PT Sans','Inter',system-ui,sans-serif"
        font-size="46" font-weight="800" fill="#ffcc00" letter-spacing="6"
        filter="url(#text-glow-v)">
    ПРИСОЕДИНЯЙСЯ
  </text>

  <g transform="translate(760 1480)">
    <circle cx="60" cy="90" r="110" fill="url(#ghost-glow-v)" opacity="0.45" filter="url(#big-glow-v)"/>
    <path d="M 0,70 Q 0,0 60,0 Q 120,0 120,70 L 120,160
             Q 105,148 90,160 Q 75,148 60,160 Q 45,148 30,160 Q 15,148 0,160 Z"
          fill="#fff5cc" opacity="0.95" filter="url(#soft-glow-v)"/>
    <circle cx="42" cy="60" r="7" fill="#0b1220"/>
    <circle cx="78" cy="60" r="7" fill="#0b1220"/>
    <path d="M 48,88 Q 60,100 72,88" fill="none" stroke="#0b1220" stroke-width="3" stroke-linecap="round"/>
    <path d="M 118,90 Q 150,60 148,20" fill="none" stroke="#fff5cc" stroke-width="9"
          stroke-linecap="round" opacity="0.95" filter="url(#soft-glow-v)"/>
    <circle cx="150" cy="16" r="9" fill="#fff5cc" filter="url(#soft-glow-v)"/>
  </g>

  <rect width="1080" height="1920" fill="url(#vignette-v)" pointer-events="none"/>
</svg>