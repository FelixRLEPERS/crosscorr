name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      slow: ${{ steps.filter.outputs.slow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            slow:
              - 'crosscorr_lib/analysis/**'
              - 'tests/test_negative_control.py'
              - 'tests/test_max_stat_pipeline.py'
              - 'tests/test_pairs.py'

  test-fast:
    name: Fast tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check crosscorr_lib/ tests/ scripts/ data/ --output-format=github

      - name: Compile all sources
        run: |
          python -m compileall -q crosscorr_lib data scripts tests

      - name: Run fast tests (skip slow)
        run: |
          python -m pytest tests/ -v -m "not slow" --cov=crosscorr_lib --cov-report=term-missing --cov-fail-under=45

  test-slow:
    name: Slow tests (push to main or PR touching analysis)
    runs-on: ubuntu-24.04
    needs: [check-changes]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       needs.check-changes.outputs.slow == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run slow tests
        run: |
          python -m pytest tests/ -v -m "slow"

  # Informational: pairs.py uses multiprocessing.shared_memory, whose
  # behaviour differs on Windows. This job is NOT required for merge.
  test-windows:
    name: Shared memory cleanup (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run shared memory cleanup tests
        run: pytest tests/test_shared_memory_cleanup.py -v

      - name: Run fast tests
        run: |
          python -m pytest tests/ -m "not slow" -q
